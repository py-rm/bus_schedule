name: Auto Update Bus Schedule

permissions: write-all

on:
  schedule:
    # Запуск в 04:00 и 16:00 по UTC (в Оренбурге это 09:00 и 21:00)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run parser script
      run: python parser.py

    - name: Commit and Push changes if schedule.json updated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add schedule.json
        
        # Проверяем, изменился ли файл, чтобы не делать пустых коммитов
        if ! git diff --quiet schedule.json; then
          git commit -m "Auto-update schedule.json"
          # Пушим напрямую с использованием токена авторизации
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git HEAD:main
        else
          echo "Изменений в расписании нет, пуш не требуется."
        fi
