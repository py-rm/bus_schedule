name: Auto Update Bus Schedule

on:
  schedule:
    # Запуск 2 раза в день: в 04:00 и 16:00 по UTC (в Оренбурге это 09:00 и 21:00)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Позволит запускать парсер вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run parser script
      run: python parser.py

    - name: Commit and Push changes if schedule.json updated
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add schedule.json
        git diff-index --quiet HEAD || git commit -m "Auto-update schedule.json"
        git push
