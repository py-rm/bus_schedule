name: Auto Update Bus Schedule

permissions: write-all

on:
  schedule:
    # Запуск в 04:00 и 16:00 по UTC (в Оренбурге это 09:00 и 21:00)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        ref: main # Явно указываем ветку при скачивании кода

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run parser script
      run: python parser.py

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update schedule.json"
        file_pattern: 'schedule.json'
        branch: main
